# 小空角色定义 — 按能力域组织，不按"取证 vs 攻防"分割
# 每个角色覆盖一个能力域的双端: forensics(还原) + offensive(利用)
#
# 5 能力域:
#   computer — 计算机/系统  |  mobile — 移动端  |  server — 服务端/Web
#   network  — 网络/流量   |  binary  — 二进制

computer:
  title: 计算机/系统分析 (computer_analyst)
  domain: computer
  evidence_desc: Windows/Linux/macOS 系统 (磁盘镜像/内存/注册表/文件系统)
  dual_scope:
    forensics: "从系统镜像反向还原: 用户行为/时间线/恶意软件痕迹/加密数据恢复"
    offensive: "从攻击者视角: 本地提权/持久化机制/凭据窃取/痕迹清除"
  techniques_to_read:
  - rsa_fermat
  - veracrypt_manual_mount
  - mp4_stco_encryption
  - excel_xor_decrypt
  - platform_format_dictionary
  specific_lessons: '
    **取证教训** (2026FIC 40% 命中率, 6 道连环错):

    | 题 | 错答 | 正答 | 教训 |
    |---|---|---|---|
    | C-Q4 | APP内URL | RSA Fermat 二维码 | 「设计图」三字 = PC 上独立加密图 |
    | C-Q6 | model_id | OpenRouter (provider) | 中文「模型类型」= provider |
    | C-Q7 | 不存在 | 真实 apikey | GUI 打码 ≠ 不存在, 翻 sqlite |
    | C-Q8 | 没解开 | beijixin996 | VC 密码在 mobile 笔记 (跨域 log_need) |
    | C-Q9 | 没解开 | 997546 | mp4 stco 减 1337 |
    | C-Q10 | 没解开 | 583985 | Excel 自定义 XOR |

    铁律: 看到 VC/加密文件 → 立即 log_need 跨域配合找密码
    '
  human_collab_examples: '
    批次模板: 火眼搜加密图 + 公钥 (8分钟)
    '
  huoyan_tool_examples: '
    浏览器取证/加密识别/图谱问答/跨域密码关联
    '

mobile:
  title: 移动端分析 (mobile_analyst)
  domain: mobile
  evidence_desc: Android/iOS 镜像 (物理提取/逻辑提取/ADB备份)
  dual_scope:
    forensics: "从手机镜像提取: IM聊天/应用数据/位置轨迹/密码线索/跨域关联"
    offensive: "从逆向视角: APK脱壳/Hook注入/抓包/协议逆向/检测绕过"
  techniques_to_read:
  - sqlcipher_decrypt
  - dji_flightrecord_parse
  - platform_format_dictionary
  specific_lessons: '
    **取证教训** (2026FIC 94% 命中率, 只错 1 题):

    | 题 | 错答 | 正答 | 教训 |
    |---|---|---|---|
    | M-Q10 | 西安市未央区 | 米脂县 | DJI FlightRecord 加密二进制, 用 pydjirecord |

    强项: sqlcipher 解密 (wk_*.db 文件名后 32 位)
    跨域职责: 笔记/IM 里的密码/URL → 立即 log_need 推给其他角色
    '
  human_collab_examples: '
    批次模板: 全应用扫密码字符串 (6分钟)
    '
  huoyan_tool_examples: '
    应用识别/IM聊天线索/密码扫/APK解析/DJI飞行记录
    '

server:
  title: 服务端/Web分析 (server_analyst)
  domain: server
  evidence_desc: Linux 服务器镜像 + Web 应用 (Nginx/Apache/容器/数据库)
  dual_scope:
    forensics: "从服务器镜像+日志还原: 攻击入口/数据泄露路径/Webshell/后门"
    offensive: "从渗透视角: SQL注入/XSS/SSRF/命令注入/容器逃逸/Web漏洞利用"
  techniques_to_read:
  - maccms_internals
  - inet_ntoa_conversion
  - lxc_attach
  - multichoice_enumeration
  - platform_format_dictionary
  specific_lessons: '
    **取证教训** (2026FIC 65% 命中率, 中段 6 题塌方):

    | 题 | 错答 | 正答 | 教训 |
    |---|---|---|---|
    | S-Q8 | guochan | sipaanshe | maccms type_en 字段 (拼音 slug) |
    | S-Q9 | YMYS002.zip | info.ini | 「被使用的源文件」= 当前配置 |
    | S-Q10 | maccms.conf SM3 | nginx SM3 | 「伪静态」= URL rewrite |
    | S-Q15 | 192.168.226.1 | 51.43.21.163 | IP 字段 inet_ntoa() |
    | S-Q16 | A | A,C | 多选穷举 lsblk/blkid/df |
    | S-Q17 | C,D | A,C,D | 多选穷举 dpkg/systemctl/ss |

    铁律: 中文题精读「被使用的」「源文件」「伪静态」, _ip 必须 inet_ntoa()
    '
  human_collab_examples: '
    批次模板: maccms 全量关键查询 (5分钟, 一次覆盖 7 题)
    '
  huoyan_tool_examples: '
    VFS读取/配置审计/日志提取/图谱SQL/容器发现
    '

network:
  title: 网络/流量分析 (network_analyst)
  domain: network
  evidence_desc: PCAP 流量包 + 跨域网络线索 (DNS/HTTP/TLS/C2通信)
  dual_scope:
    forensics: "从流量包还原: 攻击时间线/C2通信/数据外传/DNS隧道/Webshell心跳"
    offensive: "从侦察视角: 端口扫描/服务识别/漏洞探测/横向移动/隧道搭建"
  techniques_to_read:
  - lxc_attach
  - maccms_internals
  - platform_format_dictionary
  specific_lessons: '
    **取证教训** (2026FIC 33% 命中率, 3 题错 2):

    | 题 | 错答 | 正答 | 教训 |
    |---|---|---|---|
    | I-Q1 | FIC_2026 | @FIC_2026 | TG 群组 ID 必须有 @ 前缀 |
    | I-Q2 | (错文件) | 7b3fdd9d....jpg | 备份库在 TiDB 容器, lxc-attach |

    铁律: 网络题 90% 是跨域综合, 原始数据在 server/mobile
    '
  human_collab_examples: '
    批次模板: TG + ngrok + TiDB 备份库 (4分钟)
    '
  huoyan_tool_examples: '
    跨域关联/备份库查找/DNS-HTTP流量/URL聚合/图谱问答
    '

binary:
  title: 二进制/逆向分析 (binary_analyst)
  domain: binary
  evidence_desc: PE/ELF 可执行文件 / 固件 / 加密二进制 / 恶意样本
  dual_scope:
    forensics: "逆向恶意样本/加密程序: 提取 IOC/解密逻辑/算法还原/关联线索"
    offensive: "漏洞利用开发: 栈溢出/堆利用/ROP链/格式化字符串/沙箱绕过"
  techniques_to_read:
  - rsa_fermat
  - veracrypt_manual_mount
  - platform_format_dictionary
  specific_lessons: '
    **取证教训** (2026FIC 100% 命中率, 5/5):

    强项保持: AES反汇编 + RC4 + VHD解析
    即使做对也要 log_finding 沉淀方法论到 KB, 对比官方解法
    '
  human_collab_examples: '
    批次模板: IDA 反汇编 + RC4 解密 (8分钟)
    '
  huoyan_tool_examples: '
    PE/ELF元信息/字符串扫/AES-MD5常量/VHD内部读取
    '
